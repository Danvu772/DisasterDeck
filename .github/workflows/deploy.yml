# Deploy (#7): a version tag on main goes live on ECS Fargate. Retires the Vultr prod-branch path.
# Promote what is on main with a tag:
#   git tag -a v1.2.3 -m "release v1.2.3" && git push origin v1.2.3
# The workflow authenticates to AWS with GitHub OIDC (no long-lived keys), builds the image, pushes
# it to the ECR repo the CDK stack defines, then rolls out both the web and Brain services and waits
# for them to stabilize. A service whose tasks never pass the ALB health check on /login is rolled
# back by ECS's deployment circuit breaker, which the CDK stack keeps enabled.
#
# AWS is selected through Actions `vars`, not secrets (a role ARN and region are not secrets). The
# orchestrator sets them once after `cdk deploy`:
#   vars.AWS_DEPLOY_ROLE_ARN  arn of the OIDC-trusted deploy role (stack output DeployRoleArn)
#   vars.AWS_REGION           e.g. us-east-2
#   vars.AWS_STACK_NAME       e.g. DisasterDeckStack
# The cluster, service names and ECR repo URI are read back from the stack's outputs.
name: Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # OIDC: assume the deploy role with a web-identity token, no access keys

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No AWS access keys. This step asks GitHub's IdP for a token and assumes the deploy role.
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read the stack (ECR repo, cluster, services)
        id: stack
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          outputs() {
            aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "repo=$(outputs RepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(outputs ClusterName)" >> "$GITHUB_OUTPUT"
          echo "web=$(outputs WebServiceName)" >> "$GITHUB_OUTPUT"
          echo "brain=$(outputs BrainServiceName)" >> "$GITHUB_OUTPUT"
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.stack.outputs.repo }}"
      - name: Build and push the image
        run: |
          IMAGE="${{ steps.stack.outputs.repo }}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Roll out web and Brain, wait for stability
        # The task definitions pin the `latest` tag. A force-new-deployment relabels the tasks so
        # ECS pulls the freshly pushed image. The web service's circuit breaker rolls back when
        # /login never goes healthy; this step's wait then fails the run.
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          CLUSTER="${{ steps.stack.outputs.cluster }}"
          WEB="${{ steps.stack.outputs.web }}"
          BRAIN="${{ steps.stack.outputs.brain }}"
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB" --force-new-deployment --no-cli-pager
          aws ecs update-service --cluster "$CLUSTER" --service "$BRAIN" --force-new-deployment --no-cli-pager
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$WEB" "$BRAIN"