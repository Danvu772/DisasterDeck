name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_MODE: "1"
      # Build-only placeholder so Auth.js can load. Not a real secret.
      AUTH_SECRET: ci-build-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Historical replay integrity and worker tests
        run: npm run check:replay
      - name: Model adapter (OpenRouter, mocked; no key)
        run: npm run check:llm
      - name: Lint
        run: npx eslint
      - name: Product name is Disaster Deck
        run: npm run check:name
      - name: Design tokens
        run: npm run check:tokens
      - name: Build
        run: npx next build
