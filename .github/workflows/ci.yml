name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: "1"
      # Build-only placeholder so Auth.js can load. Not a real secret.
      AUTH_SECRET: ci-build-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Historical replay integrity and worker tests
        run: npm run check:replay
      - name: Official-feed replay and help directory (WS-1/2/3)
        run: npm run check:feeds
      - name: Model adapter (OpenRouter, mocked; no key)
        run: npm run check:llm
      - name: Voice port (Transcribe + Polly, mocked; no key)
        run: npm run check:voice
      - name: Lint
        run: npx eslint
      - name: Product name is Disaster Deck
        run: npm run check:name
      - name: Design tokens
        run: npm run check:tokens
      # The production artifact: DEMO_MODE=0, as deploy.yml builds it. motion is swapped out (D-0001).
      - name: Build (production mode)
        run: npx next build
        env:
          DEMO_MODE: "0"
      - name: motion and liquid-gooey are not in the build (D-0001)
        run: npm run check:bundle
      # UI-1: axe on the USWDS shell and /login. Starts `next start` on the build above with
      # DEMO_MODE=1 and no database (e2e/playwright.a11y.config.ts).
      - name: Install the accessibility test
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Accessibility (axe, UI-1)
        working-directory: e2e
        run: npm run test:a11y
      # #16 (INV-5, VOX-1): /field and /talk at 360 px, model down, no speech request. Own server on 3101.
      - name: Phone screens (field and talk, 360 px)
        working-directory: e2e
        run: npm run test:phone
      - name: Keep the accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            e2e/report/a11y
            e2e/test-results/a11y
            e2e/report/phone
            e2e/test-results/phone
          retention-days: 7

  # CI-2: the Mongo-backed checks (keeper, sweeper, api, security) against a throwaway database,
  # so the done check no longer needs a hand-run evidence step. Mongo is a fresh service container
  # that dies with the job; the checks themselves still use their own throwaway desks and delete
  # what they make. Only security:check needs an HTTP server, so it starts `next start` itself.
  mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Every value here is throwaway for CI. AGENT_KEY and AUTH_SECRET are not real secrets;
      # .env.local is gitignored and only ever written at run time, never committed.
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: disaster_desk
      DESK_ID: antakya-2023
      DEMO_MODE: "1"
      AGENT_KEY: ci-throwaway-agent-key-0123456789abcdef
      AUTH_SECRET: ci-build-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      # The check scripts run with `tsx --env-file=.env.local`, which errors if the file is
      # missing, so write it. Process env set above already wins over this file; it stays the
      # single source of truth for `next build`/`next start` and any plain `node` step.
      - name: Write a throwaway .env.local
        run: |
          printf '%s\n' \
            'MONGODB_URI=mongodb://127.0.0.1:27017' \
            'MONGODB_DB=disaster_desk' \
            'DESK_ID=antakya-2023' \
            'DEMO_MODE=1' \
            'AGENT_KEY=ci-throwaway-agent-key-0123456789abcdef' \
            'AUTH_SECRET=ci-build-placeholder-not-a-secret' \
            'NEXT_TELEMETRY_DISABLED=1' \
            > .env.local
      - name: Wait for Mongo
        run: |
          for i in $(seq 1 30); do
            node -e "require('mongodb').MongoClient.connect(process.env.MONGODB_URI, { serverSelectionTimeoutMS: 500 }).then(() => process.exit(0)).catch(() => process.exit(1))" && exit 0
            sleep 1
          done
          echo "Mongo did not become ready" >&2
          exit 1
      - name: Seed users and shelters
        run: npm run db:seed
      - name: Memory keeper check
        run: npm run keeper:check
      - name: Sweeper check
        run: npm run sweeper:check
      - name: API check
        run: npm run api:check
      - name: Build (for security:check's server)
        run: npx next build
      - name: Security check (next start, DEMO_MODE=1)
        run: |
          npx next start -p 3000 >/tmp/next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/login >/dev/null || { cat /tmp/next.log; exit 1; }
          npm run security:check
